<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Juego - Pong Arena</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <header>
    <a href="/">Pong Arena</a>
    <nav>
      <a href="/leaderboard">Leaderboard</a>
      <a href="/profile">Perfil</a>
    </nav>
  </header>
  <main>
    <div class="card">
      <h1>Pong vs IA</h1>
      <p class="helper">Controles: W / S para mover tu paddle.</p>
      <div id="status" class="helper" style="margin-top:0.5rem;"></div>
      <div class="scoreboard">
        <span>Jugador: <span id="playerScore">0</span></span>
        <span>IA: <span id="aiScore">0</span></span>
      </div>
      <canvas id="pongCanvas" width="720" height="400"></canvas>
      <div style="margin-top:1rem; display:flex; gap:1rem; flex-wrap:wrap;">
        <button class="btn" id="startBtn">Start / Restart</button>
        <button class="btn secondary" id="logoutBtn" type="button">Logout</button>
      </div>
      <div id="message" style="margin-top:1rem;"></div>
    </div>
  </main>
  <script src="/js/game.js"></script>
</body>
</html>
